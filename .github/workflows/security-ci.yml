name: Security & Build CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly security scan

permissions:
  contents: read

jobs:
  security-audit:
    name: 🔐 Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: 🔍 npm audit
        run: npm audit --audit-level=high
      
      - name: Détection de secrets versionnés
        run: |
          set -euo pipefail
          # Clés privées, jetons d'API et clé service_role laissés dans le dépôt.
          if git grep -nIE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|\bsk-[A-Za-z0-9]{24,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*eyJ)' -- . ':!*.example' ':!package-lock.json' ':!bun.lock' ':!*.patch'; then
            echo "::error::Secret potentiel détecté dans le dépôt."
            exit 1
          fi

  lint:
    name: 📝 ESLint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: 🏗️ Build
        run: npm run build

  summary:
    name: ✅ Security Summary
    runs-on: ubuntu-latest
    needs: [security-audit, lint, build]
    if: always()
    
    steps:
      - name: 📊 Report Status
        run: |
          echo "════════════════════════════════════════"
          echo "   🔐 SECURITY CHECK COMPLETED"
          echo "════════════════════════════════════════"
          echo "✅ All checks passed!"
