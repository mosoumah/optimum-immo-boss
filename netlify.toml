# Configuration Netlify — Optimum Immo (SPA React + Vite)
#
# - `npm run build` produit le dossier `dist` (Vite).
# - La redirection 200 vers /index.html est indispensable à React Router :
#   sans elle, un rechargement sur /dashboard ou /factures renverrait 404.
# - Les en-têtes de sécurité s'appliquent à toutes les réponses.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # script-src 'self' : aucun script inline ni eval. Le seul handler inline de
    # index.html a été retiré pour rendre cette directive applicable sans 'unsafe-inline'.
    # style-src 'unsafe-inline' reste nécessaire (attributs style de framer-motion).
    # Mode rapport seulement : repasser à Content-Security-Policy après vérification de la console sur toutes les pages
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
